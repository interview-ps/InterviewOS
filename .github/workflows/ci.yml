name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock', 'tests/contract/uv.lock') }}

      # `tests/ai/` drive the Node fixture `fake_provider_cli.mjs` and
      # `tests/orchestrator/test_mcp.py` spawns `fake-mcp-server.mjs`, which
      # imports `@modelcontextprotocol/sdk` — so the workspace deps are needed.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install node deps
        run: pnpm install

      - name: Lint
        working-directory: apps/api
        run: uv run ruff check .

      - name: Typecheck
        working-directory: apps/api
        run: uv run mypy src tests

      - name: Tests
        working-directory: apps/api
        run: uv run pytest -q

  contract:
    name: contract (FastAPI HTTP suite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock', 'tests/contract/uv.lock') }}

      # The suite spawns the fake MCP server fixture (node + @modelcontextprotocol/sdk).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install node deps
        run: pnpm install

      - name: Run the contract suite (spawns FastAPI on the mock runtime)
        working-directory: tests/contract
        run: uv run pytest -q

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build web app
        run: pnpm --filter @interview-os/web build

  e2e:
    name: e2e (Playwright, mock runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock', 'tests/contract/uv.lock') }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e (builds the SPA, serves UI + API from FastAPI)
        run: pnpm test:e2e
