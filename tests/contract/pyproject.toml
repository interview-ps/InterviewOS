[project]
name = "interview-os-contract"
version = "0.1.0"
description = "Black-box HTTP contract tests for the Interview OS API (Hono now, FastAPI parity gate later)."
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.uv]
package = false
