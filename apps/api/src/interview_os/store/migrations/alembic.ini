# Alembic configuration for the single Interview OS SQLite database.
#
# sqlalchemy.url is intentionally empty: env.py resolves it from
# INTERVIEW_OS_DB (or the default data/interview-os.db), so the CLI and the
# server always migrate the same file.

[alembic]
script_location = %(here)s
prepend_sys_path = .
path_separator = os

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
