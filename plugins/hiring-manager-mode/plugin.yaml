    label: Hiring manager
    description: "Scope, impact, priorities and leadership style — the conversation a hiring manager would have."
    scope:
      include:
        - hiring-manager
        - behavioral.leadership
        - communication
    rubric:
      - id: roleFit
        label: Role fit
        description: Understands the role and articulates mutual fit.
      - id: scopeImpact
        label: Scope & impact
        description: Describes scope of influence and business impact credibly.
      - id: prioritization
