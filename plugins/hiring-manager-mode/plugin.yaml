      - id: leadership
        label: Leadership
        description: Leads through ambiguity; develops people and direction.
      - id: collaboration
        label: Collaboration
        description: Works across teams and manages stakeholders.
      - id: motivation
        label: Motivation
        description: Genuine, specific motivation for this team and role.
    initialState:
      themesCovered: []
    context:
      companyThemes: true
      storyTitles: true
    interviewerPrompt: prompts/interviewer.md
    evaluatorPrompt: prompts/evaluator.md
