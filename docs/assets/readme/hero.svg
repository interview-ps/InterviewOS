<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Interview OS — interview preparation that learns from your answers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3178C6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3178C6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#3178C6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="wmc">
      <text x="72" y="168" font-size="64" font-weight="800" letter-spacing="1">Interview OS</text>
    </clipPath>
  </defs>
  <style>
    text{font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.3,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .bar{transform-box:fill-box;transform-origin:left center}
    .grow{animation:grow 1s cubic-bezier(.2,.7,.3,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.07)}}
    .sheen{animation:sheen 6s ease-in-out infinite}
    @keyframes sheen{0%{transform:translateX(0)}55%,100%{transform:translateX(1750px)}}
    .dip{animation:grow 1s cubic-bezier(.2,.7,.3,1) .3s both,dip 7s ease-in-out 1.8s infinite}
    @keyframes dip{0%,40%{fill:#22C55E;transform:scaleX(1)}52%,66%{fill:#F59E0B;transform:scaleX(.5)}86%,100%{fill:#22C55E;transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="url(#bg)" stroke="#94A3B8" stroke-opacity="0.35"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>
  <circle cx="905" cy="205" r="235" fill="url(#orb)" class="pulse"/>
  <circle cx="1100" cy="72" r="110" fill="url(#orb)" class="pulse" style="animation-delay:-2.5s"/>

  <g class="rise">
    <text id="wm" x="72" y="168" font-size="64" font-weight="800" letter-spacing="1" fill="url(#word)">Interview OS</text>
  </g>
  <g clip-path="url(#wmc)">
    <rect class="sheen" x="-340" y="60" width="280" height="140" fill="url(#sheen)"/>
  </g>
  <rect class="rise" style="animation-delay:.25s" x="72" y="188" width="88" height="4" rx="2" fill="url(#word)"/>
  <text class="rise" style="animation-delay:.2s" x="72" y="224" font-size="22" fill="#B9C9E8">Interview preparation that learns from your answers.</text>

  <g class="rise" style="animation-delay:.4s">
    <rect x="72" y="258" width="186" height="42" rx="21" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.4"/>
    <text x="165" y="285" font-size="19" text-anchor="middle" fill="#9FD9F2">Evidence-backed</text>
  </g>
  <g class="rise" style="animation-delay:.5s">
    <rect x="274" y="258" width="148" height="42" rx="21" fill="#3178C6" fill-opacity="0.10" stroke="#3178C6" stroke-opacity="0.5"/>
    <text x="348" y="285" font-size="19" text-anchor="middle" fill="#AFC9F2">Local-first</text>
  </g>
  <g class="rise" style="animation-delay:.6s">
    <rect x="438" y="258" width="148" height="42" rx="21" fill="#8B5CF6" fill-opacity="0.10" stroke="#8B5CF6" stroke-opacity="0.45"/>
    <text x="512" y="285" font-size="19" text-anchor="middle" fill="#C7B7F2">Open-source</text>
  </g>

  <g>
    <text x="664" y="62" font-size="20" fill="#9FB4DC">Caching</text>
    <rect x="664" y="74" width="476" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect class="bar dip" x="664" y="74" width="381" height="18" rx="9" fill="#22C55E"/>

    <text x="664" y="118" font-size="20" fill="#9FB4DC">System design</text>
    <rect x="664" y="130" width="476" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect class="bar grow" style="animation-delay:.45s" x="664" y="130" width="409" height="18" rx="9" fill="url(#bar)"/>

    <text x="664" y="174" font-size="20" fill="#9FB4DC">Distributed systems</text>
    <rect x="664" y="186" width="476" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect class="bar grow" style="animation-delay:.55s" x="664" y="186" width="295" height="18" rx="9" fill="url(#bar)"/>

    <text x="664" y="230" font-size="20" fill="#9FB4DC">Behavioral</text>
    <rect x="664" y="242" width="476" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect class="bar grow" style="animation-delay:.65s" x="664" y="242" width="428" height="18" rx="9" fill="url(#bar)"/>

    <text x="664" y="286" font-size="20" fill="#9FB4DC">Coding</text>
    <rect x="664" y="298" width="476" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect class="bar grow" style="animation-delay:.75s" x="664" y="298" width="343" height="18" rx="9" fill="url(#bar)"/>

    <text x="664" y="342" font-size="20" fill="#9FB4DC">APIs</text>
    <rect x="664" y="354" width="476" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect class="bar grow" style="animation-delay:.85s" x="664" y="354" width="371" height="18" rx="9" fill="url(#bar)"/>
  </g>
</svg>
