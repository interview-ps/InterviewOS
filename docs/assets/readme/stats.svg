<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" role="img" aria-label="Interview OS at a glance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    text{font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .card{opacity:0;animation:pop .7s cubic-bezier(.2,.7,.3,1) forwards}
    @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="139" rx="16" fill="url(#bg)" stroke="#94A3B8" stroke-opacity="0.35"/>
  <rect width="1200" height="140" rx="16" fill="url(#grid)"/>

  <g class="card" style="animation-delay:.1s">
    <rect x="12" y="20" width="276" height="100" rx="12" fill="#14213D" stroke="#26395E"/>
    <text x="150" y="76" font-size="46" font-weight="800" text-anchor="middle" fill="#22D3EE">7</text>
    <text x="150" y="103" font-size="20" text-anchor="middle" fill="#93A6CC">interview modes</text>
  </g>
  <g class="card" style="animation-delay:.25s">
    <rect x="312" y="20" width="276" height="100" rx="12" fill="#14213D" stroke="#26395E"/>
    <text x="450" y="76" font-size="46" font-weight="800" text-anchor="middle" fill="#8B5CF6">5</text>
    <text x="450" y="103" font-size="20" text-anchor="middle" fill="#93A6CC">AI runtimes</text>
  </g>
  <g class="card" style="animation-delay:.4s">
    <rect x="612" y="20" width="276" height="100" rx="12" fill="#14213D" stroke="#26395E"/>
    <text x="750" y="76" font-size="46" font-weight="800" text-anchor="middle" fill="#4F9CF0">12</text>
    <text x="750" y="103" font-size="20" text-anchor="middle" fill="#93A6CC">built-in skills</text>
  </g>
  <g class="card" style="animation-delay:.55s">
    <rect x="912" y="20" width="276" height="100" rx="12" fill="#14213D" stroke="#26395E"/>
    <text x="1050" y="76" font-size="46" font-weight="800" text-anchor="middle" fill="#22C55E">0</text>
    <text x="1050" y="103" font-size="20" text-anchor="middle" fill="#93A6CC">API keys pasted</text>
  </g>
</svg>
